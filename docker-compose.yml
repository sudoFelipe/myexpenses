services:
  mongodb:
    image: mongo:8.0
    container_name: myexpenses-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: myexpenses_user
      MONGO_INITDB_ROOT_PASSWORD: myexpenses_dev
    ports:
      - "27017:27017"
    volumes:
      - myexpenses_mongo_data:/data/db

volumes:
  myexpenses_mongo_data:
